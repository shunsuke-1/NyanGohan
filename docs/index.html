<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>にゃんご飯 サポート</title>
  <meta name="description" content="にゃんご飯のサポートページとプライバシーポリシーです。">
  <style>
    :root {
      --bg: #fff8f6;
      --card: rgba(255, 255, 255, 0.92);
      --line: #f0d7d9;
      --text: #402c2b;
      --sub: #7c6668;
      --accent: #ef6987;
      --accent-strong: #de4f72;
      --shadow: 0 24px 60px rgba(239, 105, 135, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #fff, #ffeef2 35%, transparent 65%),
        linear-gradient(180deg, #fff, var(--bg));
      min-height: 100vh;
    }

    .wrap {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 72px;
    }

    .hero {
      text-align: center;
      margin-bottom: 28px;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,0.85);
      color: var(--accent-strong);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    h1 {
      margin: 16px 0 10px;
      font-size: clamp(34px, 6vw, 56px);
      line-height: 1.05;
    }

    .lead {
      margin: 0 auto;
      max-width: 640px;
      color: var(--sub);
      font-size: 17px;
      line-height: 1.8;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 32px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .card p {
      margin: 0 0 18px;
      color: var(--sub);
      line-height: 1.8;
    }

    .link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: white;
      text-decoration: none;
      padding: 14px 18px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      font-weight: 700;
    }

    .footer {
      margin-top: 28px;
      text-align: center;
      color: var(--sub);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="badge">NYANGOHAN</div>
      <h1>にゃんご飯</h1>
      <p class="lead">
        猫のご飯の適正量を計算する iPhone アプリ「にゃんご飯」の
        サポートページとプライバシーポリシーです。
      </p>
    </section>

    <section class="grid">
      <article class="card">
        <h2>サポート</h2>
        <p>
          アプリの使い方、購入復元、登録データに関するご案内、
          お問い合わせ先を掲載しています。
        </p>
        <a class="link" href="./support.html">サポートページを見る</a>
      </article>

      <article class="card">
        <h2>プライバシーポリシー</h2>
        <p>
          本アプリで扱うデータ、保存方法、利用目的、第三者提供の有無を
          ご確認いただけます。
        </p>
        <a class="link" href="./privacy.html">プライバシーポリシーを見る</a>
      </article>
    </section>

    <p class="footer">© にゃんご飯</p>
  </main>
</body>
</html>
